<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name=apple-mobile-web-app-capable content=yes><meta name=theme-color content="#203731">
<link rel=manifest href=manifest.webmanifest><link rel=apple-touch-icon href=icons/icon-180.png>
<title>Packer Army Idea</title>
<link rel=stylesheet href=theme.css>
<style>
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.orig{display:flex;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:8px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.12);font:13px/1.3 var(--font)}
.orig .mini{width:96px;flex:none;aspect-ratio:1.3;position:relative}.orig .mini svg{position:absolute;inset:0;width:100%;height:100%}
.start{display:flex;gap:8px;align-items:center;margin:10px 0}.start select{flex:1}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--g);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:10}
.actions .btn{flex:1}.actions #send{flex:2}
</style></head><body>
<header><div class=hrow><h1 id=hd>PACKER <span>ARMY</span> · IDEA</h1></div></header>
<div class=wrap>
  <div id=top></div>
  <div id=ed></div>
  <fieldset>
    <label>WHY IS THIS BETTER? (Coach and the team will see this)</label><textarea id=msg maxlength=600 placeholder="e.g. X gets open faster if he lines up wider"></textarea>
    <div id=replaceBox style="display:none"><label>WHICH PLAY SHOULD IT REPLACE? (each team has exactly 24 plays)</label><select class=f id=repl></select></div>
  </fieldset>
  <p style="font:12px/1.4 var(--font);color:#44524d">Coach checks every idea against the league rules before the team sees it.</p>
</div>
<div class=actions><a class=btn id=cancel href="index.html" style="text-align:center;text-decoration:none">Cancel</a><button class=btn id=undo>Undo</button><button class="btn gold" id=send>Send to Coach</button></div>
<script src=config.js></script><script src=pb.js></script><script src=data.js></script><script src=editor.js></script>
<script>
const $=s=>document.querySelector(s), q=new URLSearchParams(location.search);
const FMT=/^[0-9a-z]{3,4}$/i.test(q.get('fmt')||'')?q.get('fmt'):'5v5',   // only a real format name (never markup from a link)
      N=q.get('n')?+q.get('n'):null, NEW=!N, FROM=q.get('from')?+q.get('from'):null;
const BACK='index.html'+((N||FROM)?`#play=${FMT}-${N||FROM}`:'');
document.getElementById('cancel').href=BACK;
const DKEY='pa_idea_'+FMT+'_'+(N||'new');
const clone=o=>JSON.parse(JSON.stringify(o));
// blank formation for a brand-new play: shotgun, everyone on the line of scrimmage except Q (and H behind in 6v6)
const SPOTS={C:[0,0],Q:[0,-2],X:[-3.2,0],Y:[3.2,0],Z:[1.6,0],H:[-1.3,-2.2]};
let plays=[], base=null, ed=null, work=null;
function blank(){ const keys=Object.keys((plays[0]||{players:{C:1,Q:1,X:1,Y:1,Z:1}}).players);
  return {n:0,name:'My new play',form:'SG',players:Object.fromEntries(keys.map(k=>[k,(SPOTS[k]||[0,-3]).slice()])),star:null,routes:{},ball:[],status:'new',note:null,format:FMT}; }
function save(){ PA.store.set(DKEY,{play:work,msg:$('#msg').value,repl:$('#repl').value}); }
function startFrom(p){ work=clone(p); ed.load(work,DKEY); save(); }
(async()=>{
  if(!PA.configured) return document.body.append('App not connected (config.js).');
  if(!await PA.join(true)){ location.href=BACK; return; }
  try{ plays=(await PA.loadPlays()).by[FMT]||[]; }catch(e){ return PA.say('Could not load plays: '+e.message); }
  ed=PlayEditor($('#ed'),{onChange:save});
  const d=PA.store.get(DKEY);
  if(NEW){
    $('#hd').innerHTML='PACKER <span>ARMY</span> · NEW '+FMT+' PLAY';
    $('#top').innerHTML=`<div class=start><label style="margin:0">START FROM</label><select class=f id=from><option value="">Blank formation</option>${plays.map(p=>`<option value="${p.n}">Copy of #${p.n} ${PA.esc(p.name)}</option>`).join('')}</select></div>`;
    $('#from').onchange=async e=>{ if(work&&ed.canUndo()&&!await PA.ask('Start over? Your drawing will be replaced.')) return; const p=plays.find(x=>x.n==e.target.value); const s=p?clone(p):blank(); if(p){ s.name='My version of '+p.name; } startFrom(s); };
    $('#replaceBox').style.display='block';
    $('#repl').innerHTML='<option value="">Not sure: let Coach pick</option>'+plays.map(p=>`<option value="${p.n}">Replace #${p.n} ${PA.esc(p.name)}</option>`).join('');
  } else {
    base=plays.find(p=>p.n===N); if(!base) return PA.say('Play #'+N+' not found');
    $('#hd').innerHTML=`PACKER <span>ARMY</span> · CHANGE #${N}`;
    $('#top').innerHTML=`<div class=orig><div class=mini>${PB.staticSVG(base,{aspect:1.3})}</div><div><b>Now: #${N} ${PA.esc(base.name)}</b><br>Drag players, reshape routes, or change who gets the ball below. Your idea goes to Coach first.</div></div>`;
  }
  if(d&&d.play){ work=d.play; ed.load(work,DKEY); $('#msg').value=d.msg||''; $('#repl').value=d.repl||''; PA.toast('Picked up where you left off'); }
  else { const src=FROM&&plays.find(p=>p.n===FROM); if(NEW&&src){ const s=clone(src); s.name='My version of '+src.name; startFrom(s); $('#from').value=FROM; } else startFrom(NEW?blank():base); }
  $('#msg').oninput=save; $('#repl').onchange=save;
})();
$('#undo').onclick=()=>{ if(!ed.undo()) PA.toast('Nothing to undo'); };
$('#send').onclick=async()=>{
  if(!NEW && JSON.stringify(work)===JSON.stringify(base)) return PA.toast('Change something first');
  if(!(work.ball||[]).length && !await PA.ask('Your play has no pass or hand-off yet (Ball button). Send anyway?')) return;
  if(!await PA.join(true)) return;
  $('#send').disabled=true; $('#send').textContent='Sending…';
  try{
    const repl=$('#repl').value?+$('#repl').value:null;
    await PA.propose(FMT,NEW?'new':'modify',NEW?repl:N,work,$('#msg').value);
    PA.store.del(DKEY); PA.toast('Sent! Coach will look at it.',3000);
    setTimeout(()=>location.href=BACK,900);
  }catch(e){ PA.say('Could not send: '+e.message); $('#send').disabled=false; $('#send').textContent='Send to Coach'; }
};
</script></body></html>
