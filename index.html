<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name=apple-mobile-web-app-capable content=yes><meta name=mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-title content="Packer Army"><meta name=theme-color content="#203731">
<link rel=manifest href=manifest.webmanifest><link rel=apple-touch-icon href=icons/icon-180.png>
<title>Packer Army Playbook</title>
<link rel=stylesheet href=theme.css>
<style>
main{padding:8px 8px 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:1100px;margin:0 auto}
@media(min-width:700px),(orientation:landscape){main{grid-template-columns:repeat(4,1fr)}}      /* iPad, computer, phone sideways: 4 across like the wristband */
.tile{background:#fff;border-radius:9px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);position:relative;user-select:none;-webkit-user-select:none;cursor:pointer}
.tile .b{height:24px;display:flex;align-items:center;gap:6px;padding:0 7px;background:var(--g);color:#fff;white-space:nowrap}   /* same height as before */
.tile .b .num{font-size:14px;font-weight:600;flex:none}
.tile .b .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:500;letter-spacing:.05em}
.tile .t{height:31px;padding:3px 7px 0;font-size:10.5px;line-height:1.3;letter-spacing:.05em;color:#2b3632;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .t em{font-style:normal;font-weight:600;color:var(--g)}
.tile .d{aspect-ratio:1.3;position:relative}
.tile .d svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;left:5px;bottom:5px;font-size:9px;font-weight:600;background:var(--gold);color:#111;padding:2px 5px;border-radius:4px;letter-spacing:.08em}
.tag.up{background:var(--g);color:var(--gold)}
.ib{position:absolute;right:5px;bottom:5px;font-size:10px;font-weight:600;background:#fff;border:1.5px solid var(--gold);border-radius:9px;padding:1px 6px}
#coachBtn{flex:none;background:none;border:1.5px solid var(--g3);color:var(--mute);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;letter-spacing:.08em}
#coachBtn.on{background:var(--gold);border-color:var(--gold);color:#111}
#inbox{display:none;margin:8px 8px 0;background:var(--gold);color:#111;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;letter-spacing:.08em;text-decoration:none;text-align:center}
#inbox.show{display:block}
/* schedule */
.sched{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;max-width:760px;width:100%;margin:0 auto}
.shead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 0;font-size:13px;letter-spacing:.08em;color:var(--g)}
.shead b{font-size:14px}
.game{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:9px 11px;cursor:pointer;border-left:5px solid #cfd8d4}
.game.next{border-left-color:var(--gold)}.game.w{border-left-color:#2E8B3A}.game.l{border-left-color:#C8102E}.game.t{border-left-color:#888}
.grow{display:flex;align-items:center;gap:10px}
.gwhen{flex:none;width:92px;font-size:11px;line-height:1.35;letter-spacing:.06em;color:#44524d}.gwhen b{display:block;font-size:12px;color:var(--ink)}
.gmid{flex:1;min-width:0}.gopp{font-size:15px;font-weight:600;letter-spacing:.04em}.gsub{font-size:11px;letter-spacing:.06em;color:#44524d;margin-top:2px}
.gres{flex:none;font-size:13px;font-weight:600;letter-spacing:.06em;padding:4px 8px;border-radius:6px;background:#eef1ef}
.game.w .gres{background:#2E8B3A;color:#fff}.game.l .gres{background:#C8102E;color:#fff}.game.t .gres{background:#888;color:#fff}.game.next .gres{background:var(--gold);color:#111}
.gx{display:none;margin-top:9px;padding-top:9px;border-top:1px solid #e6ebe8;font-size:12.5px;line-height:1.45;letter-spacing:.04em}
.game.open .gx{display:block}
.gx h5{margin:8px 0 2px;font-size:11px;letter-spacing:.1em;color:var(--g)}.gx p{margin:0;white-space:pre-wrap}
.gx .btn{margin-top:10px}
#dGame .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=number],input[type=date]{width:100%;font-size:16px;padding:8px 9px;border-radius:8px;border:1.5px solid #c9d2ce;background:#fff;color:var(--ink);font-family:inherit}
#legend{padding:6px 10px calc(16px + env(safe-area-inset-bottom));justify-content:center}
/* full screen */
#ov{position:fixed;inset:0;background:#0f1d19;z-index:20;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:auto}
#ov.show{display:flex}
.otop{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 10px;flex:none}
.otop .badge{border-radius:6px;padding:2px 8px;font-size:15px;font-weight:600}
.otop .n{flex:1;min-width:0;color:#fff;font-size:14px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otop button{background:none;border:0;color:#fff;font-size:26px;padding:0 8px;line-height:1}
.obody{display:flex;flex-direction:column;gap:10px;padding:0 8px 12px}
.stage{background:#fff;border-radius:12px;aspect-ratio:1.3;position:relative;width:100%;max-width:900px;align-self:center}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
#edbox{background:var(--paper);border-radius:12px;padding:8px;display:none}
.oside{display:flex;flex-direction:column;gap:8px;color:#fff;max-width:900px;width:100%;align-self:center}
.ocue{font-size:13px;letter-spacing:.06em;color:#fff}.ocue em{font-style:normal;color:var(--gold);font-weight:600}
.ctl{display:flex;gap:8px;align-items:center}
.ctl input[type=range]{flex:1;accent-color:var(--gold)}
.ctl .btn.on{background:var(--gold);color:#111}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.acts .btn{padding:11px 4px}
.acts .btn.on{background:var(--gold);color:#111}
.oside .note{color:var(--mute);font-size:12px;line-height:1.4;letter-spacing:.05em}
.oideas h4{margin:4px 0;font-size:12px;letter-spacing:.1em;color:var(--gold);font-weight:600}
.oideas a{display:flex;gap:8px;align-items:center;color:#fff;text-decoration:none;background:#1c3029;border-radius:8px;padding:7px 9px;margin:4px 0;font-size:12px;letter-spacing:.05em}
.oideas a span{flex:1}
.onav{display:flex;justify-content:space-between}.onav button{background:none;border:0;color:#fff;font-size:14px;letter-spacing:.08em;padding:6px 2px}
@media (orientation:landscape) and (max-height:520px){
  .obody{flex-direction:row;align-items:flex-start}
  .ofield{flex:0 0 58%;position:sticky;top:0}
  .stage{max-height:calc(100vh - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom));width:auto;height:calc(100vh - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  .oside{flex:1;min-width:0}
  #ov.editing .ofield{flex:0 0 62%;position:static}
  .ctl{flex-wrap:wrap}.ctl input[type=range]{flex-basis:100%}
  .acts{grid-template-columns:1fr 1fr}.acts #send{grid-column:1/-1;order:-1}
}
.oside .btn{white-space:nowrap}
@media print{ #ov,.acts,.ctl,.btn{display:none!important} }       /* buttons never print */
</style></head><body>
<header><div class=hrow><h1 id=ttl>PACKER <span>ARMY</span></h1><div class=seg id=fmts></div><button id=coachBtn>🔒 COACH</button></div><div class=tabs id=tabs></div></header>
<a id=inbox href="coach.html#review"></a>
<main id=grid></main>
<div class="legend" id=legend></div>
<div id=ov>
  <div class=otop><b class=badge id=ovn></b><div class=n id=ovt></div><button id=ovc aria-label="close">&times;</button></div>
  <div class=obody>
    <div class=ofield><div class=stage id=stage></div><div id=edbox></div></div>
    <div class=oside>
      <div class=ocue id=ovcue></div>
      <div class=ctl id=ctl><button class=btn id=anim>▶ ANIMATE</button><button class=btn id=sl>0.5×</button><input id=sc type=range min=0 max=1000 value=0 aria-label="scrub"></div>
      <div class=acts><button class=btn id=edit>✏️ EDIT</button><button class="btn gold" id=send>📤 SEND TO COACH</button><button class=btn id=sync>🔄 SYNC</button></div>
      <div class=note id=ovnote></div>
      <div class=oideas id=ovideas></div>
      <a class="btn ghost" id=newfrom style="text-align:center;text-decoration:none;color:#fff;border-color:#3d6155">＋ NEW PLAY FROM THIS</a>
      <div class=onav><button id=pv>&larr; PREV</button><button id=nx>NEXT &rarr;</button></div>
    </div>
  </div>
</div>
<dialog id=dCoach><h2>Coach sign-in</h2><p>Only the coach account can save plays for the whole team and review player ideas.</p>
  <label>EMAIL</label><input type=email id=cEmail autocomplete=username autocapitalize=off><label>PASSWORD</label><input type=password id=cPass autocomplete=current-password>
  <div id=cMsg style="color:var(--warn);font-size:13px;min-height:18px;margin-top:8px"></div>
  <div class=row><button class="btn ghost" id=cCancel>Cancel</button><button class="btn gold" id=cGo>Sign in</button></div></dialog>
<dialog id=dGame><h2 id=gTitle>Game</h2>
  <div class=g2><div><label>PACKERS SCORE</label><input type=number id=gOurs min=0 max=199 inputmode=numeric></div><div><label>OPPONENT SCORE</label><input type=number id=gTheirs min=0 max=199 inputmode=numeric></div></div>
  <label>NOTES (before the game: meet time, jerseys, reminders)</label><textarea id=gNotes maxlength=600></textarea>
  <label>RECAP (after the game)</label><textarea id=gRecap maxlength=4000 style="min-height:110px"></textarea>
  <details id=gMore style="margin-top:8px"><summary style="font-size:12px;letter-spacing:.08em;color:var(--g);cursor:pointer">CHANGE DATE / TIME / FIELD / TEAMS</summary>
    <div class=g2><div><label>WEEK</label><input type=number id=gWeek min=0 max=30></div><div><label>DATE</label><input type=date id=gDate></div></div>
    <div class=g2><div><label>TIME</label><input id=gTime maxlength=20 placeholder="1:15 PM"></div><div><label>FIELD</label><input id=gField maxlength=60></div></div>
    <label>HOME</label><input id=gHome maxlength=60 placeholder="Packers Barber"><label>AWAY</label><input id=gAway maxlength=60><label>LABEL (e.g. SEMIFINAL)</label><input id=gLabel maxlength=40></details>
  <div class=row><button class="btn ghost" id=gDel>Delete</button><button class="btn ghost" id=gCancel>Cancel</button><button class="btn gold" id=gSave>Save</button></div></dialog>
<dialog id=dSend><h2>Send to Coach</h2><p>Why is this better? Coach and the team will see this.</p><textarea id=sMsg maxlength=600></textarea>
  <div class=row><button class="btn ghost" id=sCancel>Cancel</button><button class="btn gold" id=sOk>Send</button></div></dialog>
<script src=config.js></script><script src=pb.js></script><script src=data.js></script><script src=editor.js></script>
<script>
const $=s=>document.querySelector(s), clone=o=>JSON.parse(JSON.stringify(o)), same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
let BY={}, SEEN='', FMT='', FMTS=[], plays=[], band=[], defs=[], VIEW=[], tab=0, IDEAS=[];   // VIEW = the list full screen steps through (offense or defense)
const grid=$('#grid'), TL={}, tl=p=>TL[p.n]||(TL[p.n]=PB.timeline(p));
const isCoach=()=>!!PA.coachEmail();

/* ---------- grid ---------- */
function buildFmts(){ $('#fmts').innerHTML=FMTS.map(f=>`<button class="${f===FMT?'on':''}">${f}</button>`).join(''); }
$('#fmts').onclick=e=>{ if(e.target.tagName==='BUTTON') show(e.target.textContent); };
function buildTabs(){ const n=Math.ceil(band.length/8); DEF=n; SCHED=n+1; if(tab>SCHED) tab=0;
  $('#tabs').innerHTML=[...Array(n)].map((_,i)=>`<button class="${i===tab?'on':''}">CARD ${i+1}</button>`).join('')+`<button class="${tab===DEF?'on':''}">DEFENSE</button><button class="${tab===SCHED?'on':''}">SCHEDULE</button>`; }
$('#tabs').onclick=e=>{ const i=[...$('#tabs').children].indexOf(e.target); if(i>=0){ tab=i; draw(); } };
function tagFor(p){ if(PA.recent(p,14)) return '<span class="tag up">UPDATED</span>'; return p.status==='new'?'<span class="tag">NEW</span>':''; }
const openIdeas=p=>IDEAS.filter(x=>x.fmt===FMT&&x.target_n===p.n&&x.status==='shared');
function cueHTML(p){ return (p.sub?`<em>${PA.esc(p.sub)}</em> · `:'')+PA.esc(p.cue||''); }
function draw(){
  [...$('#tabs').children].forEach((b,i)=>b.classList.toggle('on',i===tab)); grid.innerHTML='';
  if(tab===SCHED){ $('#legend').innerHTML=''; return drawSchedule(); }
  const isDef=tab===DEF, list=isDef?defs:band.slice(tab*8,tab*8+8); VIEW=isDef?defs:band;
  list.forEach(p=>{ const t=document.createElement('div'); t.className='tile'; const oi=openIdeas(p).length;
    t.innerHTML=`<div class="b cat-${PA.catOf(p)}"><span class=num>${p.n}</span><span class=nm></span></div><div class=t>${cueHTML(p)}</div><div class=d>${PB.staticSVG(p,{aspect:1.3})}</div>${tagFor(p)}${oi?`<span class=ib>💡 ${oi}</span>`:''}`;
    t.querySelector('.nm').textContent=p.name; t.onclick=()=>openOv(VIEW.indexOf(p)); grid.appendChild(t);
    PA.fit(t.querySelector('.nm'),12,7); });
  $('#legend').innerHTML=PA.legend(isDef);
}
function show(f){ FMT=f; PA.store.set('pa_fmt',f); plays=BY[f]||[]; band=PA.band(plays); defs=PA.defense(plays); for(const k in TL) delete TL[k]; buildFmts(); buildTabs(); draw(); }

/* ---------- schedule ---------- */
let DEF=3, SCHED=4, GAMES=[], openGame=null;
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'], DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const dOf=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };            // local date, no time-zone shift
const todayISO=()=>{ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); };
function result(g){ if(g.ours==null||g.theirs==null) return null; return g.ours>g.theirs?'w':g.ours<g.theirs?'l':'t'; }
function drawSchedule(){
  const mine=GAMES.filter(g=>g.fmt===FMT), reg=mine.filter(g=>g.stage!=='playoff').sort((a,b)=>a.gdate<b.gdate?-1:a.gdate>b.gdate?1:0),
        po=mine.filter(g=>g.stage==='playoff').sort((a,b)=>(a.week||0)-(b.week||0));
  const tally=l=>{ const r={w:0,l:0,t:0}; l.forEach(g=>{ const x=result(g); if(x) r[x]++; }); return `${r.w}–${r.l}${r.t?'–'+r.t:''}`; };
  const next=[...reg,...po].find(g=>!result(g)&&g.gdate&&dOf(g.gdate)>=todayISO()), E=PA.esc;
  const card=g=>{ const tbd=!g.home||!g.away, home=PA.isUs(g.home), opp=tbd?'OPPONENT TBD':(home?g.away:g.home), r=result(g), d=g.gdate?dOf(g.gdate):null;
    const res=r?`${r.toUpperCase()} ${g.ours}–${g.theirs}`:(g===next?'NEXT':'');
    return `<div class="game ${r||''} ${g===next?'next':''} ${openGame===g.id?'open':''}" data-id="${g.id}">
      <div class=grow><div class=gwhen>${g.label?`<b style="color:var(--g)">${E(g.label)}</b>`:''}<b>${d?`${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`:'DATE TBD'}</b>${E(g.gtime||'')}${g.week!=null&&!g.label?' · WK '+g.week:''}</div>
        <div class=gmid><div class=gopp>${tbd?'':(home?'VS ':'@ ')}${E(opp)}</div><div class=gsub>${E(g.field||'FIELD TBD')}${tbd?'':' · '+(home?'HOME':'AWAY')}${g.recap?' · 📝 RECAP':''}${g.notes&&!r?' · 📌 NOTES':''}</div></div>
        ${res?`<span class=gres>${res}</span>`:''}</div>
      <div class=gx><div><b>HOME</b> ${E(g.home||'TBD')} &nbsp; <b>AWAY</b> ${E(g.away||'TBD')}</div><div><b>FIELD</b> ${E(g.field||'TBD')} &nbsp; <b>TIME</b> ${E(g.gtime||'TBD')}</div>
        ${r?`<div><b>FINAL</b> ${E(g.home)} ${home?g.ours:g.theirs} – ${E(g.away)} ${home?g.theirs:g.ours}</div>`:''}
        ${g.notes?`<h5>NOTES</h5><p>${E(g.notes)}</p>`:''}${g.recap?`<h5>RECAP</h5><p>${E(g.recap)}</p>`:''}
        ${isCoach()?`<button class="btn gold" data-edit="${g.id}">✏️ ${tbd?'ENTER TEAMS / DATE':'SCORE / NOTES / RECAP'}</button>`:''}</div></div>`; };
  const box=document.createElement('div'); box.className='sched';
  box.innerHTML=`<div class=shead><b>${E((reg[0]||po[0]||{}).division||FMT)}</b><span>RECORD ${tally(reg)}</span></div>`+
    (reg.length?reg.map(card).join(''):'<p style="font-size:13px;color:#44524d">No games yet.</p>')+
    (po.length?`<div class=shead style="margin-top:8px"><b>PLAYOFFS</b><span>${po.some(result)?'PLAYOFFS '+tally(po):''}</span></div>`+po.map(card).join(''):'')+
    (isCoach()?'<button class="btn ghost" id=addGame style="margin-bottom:10px">＋ ADD GAME</button>':'');
  grid.appendChild(box);
  box.onclick=e=>{ const ed=e.target.closest('[data-edit]'); if(ed){ e.stopPropagation(); return editGame(GAMES.find(g=>g.id===ed.dataset.edit)); }
    if(e.target.id==='addGame'){ const last=reg[reg.length-1]||{}; return editGame({fmt:FMT,division:last.division||'',week:(last.week||0)+1,gdate:'',gtime:'',field:last.field||'',home:'Packers Barber',away:'',stage:'regular'}); }
    const c=e.target.closest('.game'); if(c){ openGame=openGame===c.dataset.id?null:c.dataset.id; draw(); } };
}
let editing_game=null;
function editGame(g){ editing_game=g; const v=(id,x)=>$('#'+id).value=x==null?'':x;
  $('#gTitle').textContent=(!g.home||!g.away)?(g.label||'Playoff game'):g.id?`${PA.isUs(g.home)?'VS':'@'} ${PA.isUs(g.home)?g.away:g.home}`:'New game';
  $('#gMore').open=!g.home||!g.away;   // blank playoff slot: open the teams / date section
  v('gLabel',g.label); v('gOurs',g.ours); v('gTheirs',g.theirs); v('gNotes',g.notes); v('gRecap',g.recap); v('gWeek',g.week); v('gDate',g.gdate); v('gTime',g.gtime); v('gField',g.field); v('gHome',g.home); v('gAway',g.away);
  $('#gDel').style.display=g.id?'':'none'; $('#dGame').showModal(); }
$('#gCancel').onclick=()=>$('#dGame').close();
$('#gSave').onclick=async()=>{ const g=editing_game, n=id=>{ const x=$('#'+id).value.trim(); return x===''?null:+x; };
  const out={...g,ours:n('gOurs'),theirs:n('gTheirs'),notes:$('#gNotes').value,recap:$('#gRecap').value,week:n('gWeek'),gdate:$('#gDate').value,gtime:$('#gTime').value.trim(),field:$('#gField').value.trim(),home:$('#gHome').value.trim(),away:$('#gAway').value.trim(),label:$('#gLabel').value.trim()};
  if(out.stage!=='playoff'&&(!out.gdate||!out.home||!out.away)) return alert('Date, home and away are needed.');
  if(out.ours!=null&&(!out.home||!out.away)) return alert('Enter both teams before a score.');
  if((out.ours==null)!==(out.theirs==null)) return alert('Enter both scores (or neither).');
  try{ await PA.coachRpc('pa_save_game',{g:out}); $('#dGame').close(); await loadGames(); draw(); PA.toast('Saved. Players see it next time they open the app.'); }
  catch(e){ alert('Could not save: '+e.message); } };
$('#gDel').onclick=async()=>{ if(!confirm('Delete this game from the schedule?')) return;
  try{ await PA.coachRpc('pa_delete_game',{gid:editing_game.id}); $('#dGame').close(); await loadGames(); draw(); }catch(e){ alert(e.message); } };
async function loadGames(){ try{ GAMES=await PA.games(); }catch(e){ GAMES=GAMES||[]; } }

/* ---------- full screen ---------- */
let cur=0, slow=false, stopA=null, ed=null, work=null, editing=false;
const P=()=>VIEW[cur], DKEY=()=>'pa_idea_'+FMT+'_'+P().n;
function stop(){ if(stopA){ stopA(); stopA=null; } $('#anim').textContent='▶ ANIMATE'; }
function openOv(i){ cur=i; stop(); endEdit(); $('#ov').classList.add('show'); paintOv(); runAnim(); }
function paintOv(){ const p=editing?work:P();
  $('#ovn').className='badge cat-'+PA.catOf(p); $('#ovn').textContent=p.n; $('#ovt').textContent=p.name;
  $('#ovcue').innerHTML=cueHTML(p); $('#ovnote').textContent=p.note||'';
  if(!editing) $('#stage').innerHTML=PB.staticSVG(p,{aspect:1.3});
  $('#send').textContent=isCoach()?'💾 SAVE TO TEAM':'📤 SEND TO COACH';
  $('#edit').textContent=editing?'✓ DONE':'✏️ EDIT'; $('#edit').classList.toggle('on',editing);
  $('#newfrom').href=`edit.html?fmt=${encodeURIComponent(FMT)}&new=1&from=${P().n}`;
  const mineIds=new Set(PA.mine()), list=IDEAS.filter(x=>x.fmt===FMT&&x.target_n===P().n&&(x.status==='shared'||mineIds.has(x.id)));
  const L={pending:'WAITING FOR COACH',shared:'VOTE NOW',applied:'ADDED',declined:'NOT USED'};
  $('#ovideas').innerHTML=list.length?`<h4>💡 IDEAS FOR THIS PLAY (${list.length})</h4>`+list.map(x=>`<a href="idea.html?id=${x.id}"><span>${PA.esc(x.play.name||'Idea')} · ${PA.esc(x.author)}</span><span class="pill ${x.status}" style="flex:none">${L[x.status]}</span> 👍${x.yes} 👎${x.no}</a>`).join(''):'';
}
function runAnim(){ stop(); if(editing) return; const p=P(); $('#anim').textContent='■ STOP';
  const T=tl(p), vb=PB.viewBox(p,1.3), t0=performance.now(), speed=slow?0.5:1; let raf=0, dead=false;
  const step=now=>{ if(dead) return; const t=(now-t0)/1000*speed; $('#stage').innerHTML=PB.animSVG(p,T,Math.min(t,T.dur),{aspect:1.3,vb}); $('#sc').value=Math.round(Math.min(t/T.dur,1)*1000);
    if(t<T.dur) raf=requestAnimationFrame(step); else setTimeout(()=>{ if(!dead){ stopA=null; $('#anim').textContent='▶ ANIMATE'; $('#stage').innerHTML=PB.staticSVG(p,{aspect:1.3}); } },700); };
  raf=requestAnimationFrame(step); stopA=()=>{ dead=true; cancelAnimationFrame(raf); $('#stage').innerHTML=PB.staticSVG(p,{aspect:1.3}); }; }
$('#anim').onclick=()=>{ if(stopA) stop(); else runAnim(); };
$('#sl').onclick=e=>{ slow=!slow; e.target.classList.toggle('on',slow); };
$('#sc').oninput=e=>{ stop(); const p=P(),T=tl(p); $('#stage').innerHTML=PB.animSVG(p,T,T.dur*e.target.value/1000,{aspect:1.3}); };
$('#ovc').onclick=()=>{ if(editing&&!confirm('Close? Your edit is saved on this phone for next time.')) return; stop(); endEdit(); $('#ov').classList.remove('show'); };
$('#pv').onclick=()=>{ if(!editing) openOv((cur+VIEW.length-1)%VIEW.length); };
$('#nx').onclick=()=>{ if(!editing) openOv((cur+1)%VIEW.length); };
function startEdit(){ stop(); editing=true; const d=PA.store.get(DKEY()); work=d&&d.play?d.play:clone(P());
  if(!ed) ed=PlayEditor($('#edbox'),{onChange:()=>{ PA.store.set(DKEY(),{play:work}); paintOv(); }});
  $('#stage').style.display='none'; $('#ctl').style.display='none'; $('#edbox').style.display='block'; $('#ov').classList.add('editing');
  ed.load(work,DKEY()); paintOv(); }
function endEdit(){ editing=false; $('#stage').style.display=''; $('#ctl').style.display=''; $('#edbox').style.display='none'; $('#ov').classList.remove('editing'); }
$('#edit').onclick=()=>{ if(editing){ endEdit(); paintOv(); } else startEdit(); };
$('#send').onclick=async()=>{
  const d=PA.store.get(DKEY()), mine=editing?work:(d&&d.play);
  if(!mine||same(mine,P())) return PA.toast('Tap ✏️ EDIT and change something first');
  if(isCoach()){ try{ mine.updated=new Date().toISOString().slice(0,10);
      await PA.coachRpc('pa_save_play',{fmt:FMT,n:P().n,data:mine,reason:'Coach edit'}); PA.store.del(DKEY()); endEdit(); await load(false,true); PA.toast('Saved to the team'); }
    catch(e){ alert('Save failed: '+e.message+'\nSign in again on the Coach page (tap the title 5 times).'); } return; }
  if(!await PA.join(true)) return; $('#sMsg').value=''; $('#dSend').showModal();
};
$('#sCancel').onclick=()=>$('#dSend').close();
$('#sOk').onclick=async()=>{ const d=PA.store.get(DKEY()), mine=editing?work:d.play;
  try{ await PA.propose(FMT,'modify',P().n,mine,$('#sMsg').value); $('#dSend').close(); PA.store.del(DKEY()); endEdit(); await loadIdeas(); paintOv(); PA.toast('Sent! Coach will look at it.',3000); }
  catch(e){ alert('Could not send: '+e.message); } };
$('#sync').onclick=async()=>{ $('#sync').textContent='🔄 …'; const ch=await load(false,true); await loadIdeas(); await loadGames(); if($('#ov').classList.contains('show')&&!editing){ cur=Math.min(cur,VIEW.length-1); paintOv(); }
  $('#sync').textContent='🔄 SYNC'; PA.toast(ch?'Updated from Coach':'Up to date'); };

/* ---------- coach mode: visible sign-in, inbox of player ideas ---------- */
let PENDING=0;
function coachUI(){ const b=$('#coachBtn'), c=isCoach();
  b.classList.toggle('on',c); b.textContent=c?(PENDING?`📥 ${PENDING}`:'COACH ✓'):'🔒 COACH';
  $('#inbox').classList.toggle('show',c&&PENDING>0); $('#inbox').textContent=`📥 ${PENDING} NEW PLAYER IDEA${PENDING===1?'':'S'} — TAP TO REVIEW`;
  if($('#ov').classList.contains('show')) $('#send').textContent=c?'💾 SAVE TO TEAM':'📤 SEND TO COACH';
  if(tab===SCHED&&band.length) draw(); }   // show / hide the coach's score buttons
async function coachInbox(){ if(!isCoach()) return coachUI();
  try{ PENDING=(await PA.coachRpc('pa_coach_proposals')).filter(x=>x.status==='pending').length; }
  catch(e){ if(e.code==='28000'||e.status===401||e.status===400){ PA.logout(); PA.toast('Coach sign-in expired. Sign in again.'); } }
  coachUI(); }
$('#coachBtn').onclick=()=>{ if(isCoach()) location.href=PENDING?'coach.html#review':'coach.html'; else { $('#cMsg').textContent=''; $('#dCoach').showModal(); } };
$('#cCancel').onclick=()=>$('#dCoach').close();
$('#cGo').onclick=async()=>{ const m=$('#cMsg'); m.style.color='var(--g)'; m.textContent='Signing in…';
  try{ await PA.login($('#cEmail').value.trim(),$('#cPass').value);
    try{ await PA.coachRpc('pa_coach_proposals'); }catch(e){ PA.logout(); throw new Error('That account is not the team coach.'); }
    $('#dCoach').close(); $('#cPass').value=''; await coachInbox(); PA.toast('Coach mode on: 💾 SAVE TO TEAM on every play'); }
  catch(e){ m.style.color='var(--warn)'; m.textContent=/Invalid login/i.test(e.message)?'Wrong email or password.':e.message; } };

/* ---------- data ---------- */
async function loadIdeas(){ try{ IDEAS=await PA.ideas(); }catch(e){ IDEAS=IDEAS||[]; } }
async function load(first,quiet){
  let r; try{ r=await PA.loadPlays(); }
  catch(e){ if(PA.badCode(e)){ PA.store.del('pa_code'); await PA.join(false); return load(first,quiet); } if(first) grid.textContent='Could not load plays: '+e.message; return false; }
  const txt=JSON.stringify(r.by); if(txt===SEEN) return false; const had=!!SEEN; SEEN=txt; BY=r.by; FMTS=Object.keys(BY).sort();
  const s=PA.store.get('pa_fmt'); if(!FMT||!FMTS.includes(FMT)) FMT=FMTS.includes(s)?s:FMTS[0];
  const open=$('#ov').classList.contains('show'); show(FMT); if(open&&!editing) paintOv();
  if(had&&r.fresh&&!quiet) PA.toast('Coach updated the plays'); if(!r.fresh) PA.toast('Offline: showing saved plays');
  return had;
}
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'){ await load(false); await loadIdeas(); await loadGames(); coachInbox(); if(!$('#ov').classList.contains('show')) draw(); } });
setInterval(()=>{ if(document.visibilityState==='visible'){ load(false); coachInbox(); } },5*60*1000);
// Coach page: tap the title 5 times (works inside the installed app, where there is no address bar)
let taps=[]; $('#ttl').onclick=()=>{ const n=Date.now(); taps=taps.filter(t=>n-t<2500); taps.push(n); if(taps.length>=5) location.href='coach.html'; };
addEventListener('resize',()=>{ document.querySelectorAll('.tile .nm').forEach(n=>PA.fit(n,12,7)); });
(async()=>{
  if(!PA.configured){ grid.textContent='This app is not connected to the team database yet (config.js). See COACH_SETUP.md.'; return; }
  coachUI(); await PA.join(false); await load(true); await Promise.all([loadIdeas(),loadGames()]); draw(); coachInbox();
  const m=location.hash.match(/^#play=(\w+)-(\d+)$/); if(m&&BY[m[1]]){ show(m[1]); if(+m[2]>50){ tab=DEF; draw(); } else { VIEW=band; } const i=VIEW.findIndex(p=>p.n===+m[2]); if(i>=0) openOv(i); }
})();
// the service worker (offline + automatic app updates) is registered in data.js for every page
</script></body></html>
